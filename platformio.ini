; LilyGO T-Dongle-S3 Radio Radar
; Passive WiFi + BLE scanner. Transmits nothing; only listens.
;
; BLE + WiFi together is a large binary, so this uses a partition table
; with a 4MB app slot (huge_app) instead of the ~1.3MB default. Without
; it the link fails with "region `iram0_0_seg' overflowed" or the image
; won't fit the partition.

[env:tdongle-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.partitions = huge_app.csv
board_upload.flash_size = 16MB

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
